<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!--HEAD_EXTRA-->
<title>카피바라 vs 좀비</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3a2a1c;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:absolute;left:0;top:0;display:block}
</style></head>
<body>
<canvas id="c"></canvas>
<script>
/* 카피바라 vs 좀비 — 플레이어블 광고 (11-08, tools/playable_build.py 가 그림·글꼴을 넣어 한 파일로 만듦)
   흐름: 좀비 떼 → [공격력 카드 탭] 강화 → [같은 총알 끌어다 겹치기] 레이저 → 보스 연타 → 끝 화면(스토어)
   아무것도 안 누르면 몇 초 뒤 손가락 안내가 대신 해서 끝까지 감 */
var ASSETS = /*ASSETS*/{};
var FONT = "/*FONT*/";
var STORE = "https://play.google.com/store/apps/details?id=com.zkfpf.kachizombie";
var W = 540, H = 960;

// ---------------------------------------------------------------- 스토어로 (광고 네트워크마다 다른 창구)
var ctaDone = false;
function cta() {
  try { if (window.mraid && mraid.open) { mraid.open(STORE); return; } } catch (e) {}
  try { if (window.FbPlayableAd && FbPlayableAd.onCTAClick) { FbPlayableAd.onCTAClick(); return; } } catch (e) {}
  try { if (window.ExitApi && ExitApi.exit) { ExitApi.exit(); return; } } catch (e) {}
  try { if (window.dapi && dapi.openStoreUrl) { dapi.openStoreUrl(); return; } } catch (e) {}
  try { if (window.install) { window.install(); return; } } catch (e) {}
  window.open(STORE, "_blank");
}

// ---------------------------------------------------------------- 그림
var IMG = {};
function loadImages(done) {
  var keys = Object.keys(ASSETS), n = keys.length;
  if (!n) { done(); return; }
  keys.forEach(function (k) {
    var im = new Image();
    im.onload = im.onerror = function () { if (--n === 0) done(); };
    im.src = ASSETS[k];
    IMG[k] = im;
  });
}

// ---------------------------------------------------------------- 소리 (첫 터치 뒤 · 코드로 합성 — 파일 없음)
var AC = null, muted = false;
function audioOn() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol) {
  if (!AC || muted) return;
  var len = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  var s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 900; s.buffer = b; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
var lastShot = 0;
var SFX = {
  shot: function () { var n = performance.now(); if (n - lastShot < 45) return; lastShot = n; tone(900, 260, 0.05, "square", 0.025); },
  laser: function () { var n = performance.now(); if (n - lastShot < 60) return; lastShot = n; tone(1500, 500, 0.09, "sawtooth", 0.025); },
  coin: function () { tone(1320, 1320, 0.05, "sine", 0.05); tone(1760, 1760, 0.07, "sine", 0.05, 0.05); },
  up: function () { tone(520, 1040, 0.12, "triangle", 0.12); },
  merge: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, 0.12, "square", 0.06, i * 0.07); }); },
  boom: function () { noise(0.3, 0.35); tone(140, 40, 0.3, "sine", 0.3); },
  boss: function () { tone(110, 70, 0.6, "sawtooth", 0.12); tone(82, 55, 0.6, "square", 0.08, 0.15); },
  win: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, f, 0.18, "triangle", 0.12, i * 0.09); }); }
};

// ---------------------------------------------------------------- 화면 맞추기 (세로 540x960 을 화면에 꼭 맞게, 남는 곳은 어둡게)
var cv = document.getElementById("c"), cx = cv.getContext("2d"), scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  var vw = window.innerWidth || W, vh = window.innerHeight || H;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  scale = Math.min(vw / W, vh / H); offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
}
window.addEventListener("resize", resize);

// ---------------------------------------------------------------- 게임 상태
var S = {
  t: 0, phase: "intro", phaseT: 0, idle: 0, gold: 32000, atkLv: 40, atk: 1200, laser: false,
  kills: 0, shake: 0, flash: 0, ended: false, taps: 0, merged: false, bossDead: false
};
var Z = [], B = [], BEAMS = [], FX = [], NUM = [], COINS = [], RIP = [];
var SQUAD = [
  { x: 66, y: 402, s: 0.40, fire: 0, shoot: 0 },     // 동료 1 (위)
  { x: 54, y: 538, s: 0.46, fire: 0.17, shoot: 0 },  // 리더 (가운데 · 조금 크게)
  { x: 66, y: 674, s: 0.40, fire: 0.33, shoot: 0 }   // 동료 2 (아래)
];
var ZTYPES = ["z_basic", "z_hat", "z_bucket", "z_fat"];
var CARD = { atk: { x: 14, y: 790, w: 170, h: 127, pop: 0 }, spd: { x: 185, y: 790, w: 170, h: 127, pop: 0 }, gold: { x: 356, y: 790, w: 170, h: 127, pop: 0 } };
var SLOT_Y = 744;
var MERGE = { a: { x: 140, y: 470 }, b: { x: 330, y: 470 }, drag: null, dragX: 0, dragY: 0, anim: 0, show: 0 };
var BOSS = null;
var HAND = { x: 0, y: 0, vis: 0, press: 0 };
var INSTALL = { x: W - 132, y: 14, w: 118, h: 46 };

function fmt(v) {
  if (v < 1000) return Math.floor(v) + "";
  var u = ["", "k", "m", "b", "t"], k = Math.floor(Math.log10(v) / 3); k = Math.min(k, 4);
  var m = v / Math.pow(10, k * 3);
  var s = m < 10 ? (Math.floor(m * 100) / 100).toFixed(2) : m < 100 ? (Math.floor(m * 10) / 10).toFixed(1) : Math.floor(m) + "";
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s + u[k];
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function setPhase(p) { S.phase = p; S.phaseT = 0; S.idle = 0; }

function spawnZombie(x, y, type, hp) {
  var tp = type || ZTYPES[Math.floor(Math.random() * ZTYPES.length)];
  var hpv = hp || (tp === "z_fat" ? 9000 : tp === "z_bucket" ? 6000 : 4000);
  Z.push({ x: x, y: y, tp: tp, hp: hpv, max: hpv, sp: rnd(38, 58) * (tp === "z_fat" ? 0.7 : 1), walk: Math.random() * 4, hit: 0, dead: false, deadT: 0, kb: 0, stop: rnd(175, 215) });
}
function spawnPack(n, near) {
  for (var i = 0; i < n; i++) {
    var y = 380 + (300 * (i + rnd(0.1, 0.9))) / n;
    spawnZombie((near ? rnd(330, 520) : rnd(570, 650)) + i * 4, y);   // near = 이미 화면 안 (시작 장면)
  }
}
// 총구 = 칸(360) 안 총 회전 중심 (171,253) + 총구 (137.6,-17.6) → (308.6, 235.4) · 그림 왼쪽 위 = 발 (160, 352) 기준
function muzzle(c) { return { x: c.x + (308.6 - 160) * c.s, y: c.y - (352 - 235.4) * c.s }; }

function nearest(c) {
  var best = null, bd = 1e9;
  for (var i = 0; i < Z.length; i++) {
    var z = Z[i]; if (z.dead || z.x > 560) continue;
    var d = Math.abs(z.y - c.y) * 1.4 + (z.x - c.x);
    if (d < bd) { bd = d; best = z; }
  }
  if (BOSS && !BOSS.dead && BOSS.x < 540) { var db = Math.abs(BOSS.y - c.y) * 1.4 + (BOSS.x - c.x) - 120; if (db < bd) best = BOSS; }
  return best;
}

function damage(z, d, x, y) {
  if (z.dead) return;
  z.hp -= d; z.hit = 0.12; if (!z.boss) z.kb = 10;
  NUM.push({ x: x + rnd(-12, 12), y: y - 30 + rnd(-10, 10), v: d, t: 0, big: d >= 20000 || z.boss });
  if (z.hp <= 0) {
    z.dead = true; z.deadT = 0; S.kills++;
    FX.push({ x: z.x, y: z.y - 50 * (z.boss ? 2.4 : 1), t: 0, s: z.boss ? 2.6 : 0.8 });
    var nc = z.boss ? 14 : 2;
    for (var k = 0; k < nc; k++) COINS.push({ x: z.x + rnd(-20, 20), y: z.y - 60, vx: rnd(-90, 90), vy: rnd(-260, -120), t: 0, v: z.boss ? 250000 : 900 });
    if (z.boss) { SFX.boom(); S.shake = 0.6; S.flash = 0.5; } else if (Math.random() < 0.5) SFX.boom();
  }
}

function fireSquad(dt) {
  for (var i = 0; i < SQUAD.length; i++) {
    var c = SQUAD[i];
    c.shoot = Math.max(0, c.shoot - dt);
    c.fire -= dt;
    if (c.fire > 0) continue;
    var tg = nearest(c);
    if (!tg) { c.fire = 0.1; continue; }
    var m = muzzle(c);
    c.shoot = 0.12;
    if (S.laser) {
      c.fire = 0.26;
      var tx = Math.max(m.x + 60, tg.x), ty = tg.boss ? tg.y - 110 : tg.y - 40;
      var slope = (ty - m.y) / (tx - m.x);
      BEAMS.push({ x: m.x, y: m.y, ex: 580, ey: m.y + slope * (580 - m.x), t: 0 });
      SFX.laser();
      // 레이저 = 그 줄 위 좀비 전부
      for (var k = 0; k < Z.length; k++) {
        var z = Z[k]; if (z.dead || z.x < m.x) continue;
        var ly = m.y + slope * (z.x - m.x);
        if (Math.abs(ly - (z.y - 40)) < 46) damage(z, 30000, z.x, z.y - 60);
      }
      if (BOSS && !BOSS.dead) damage(BOSS, 42000, BOSS.x - 40, BOSS.y - 160);
    } else {
      c.fire = 0.42;
      var dx = tg.x - m.x, dy = (tg.y - (tg.boss ? 120 : 45)) - m.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      B.push({ x: m.x, y: m.y, vx: dx / L * 1000, vy: dy / L * 1000, d: S.atk, tg: tg });
      SFX.shot();
    }
  }
}

// ---------------------------------------------------------------- 진행 단계
function update(dt) {
  S.t += dt; S.phaseT += dt; S.idle += dt;
  S.shake = Math.max(0, S.shake - dt); S.flash = Math.max(0, S.flash - dt);
  for (var k in CARD) CARD[k].pop = Math.max(0, CARD[k].pop - dt);
  HAND.press = Math.max(0, HAND.press - dt);

  var ph = S.phase;
  if (ph === "intro") {
    if (S.phaseT < 0.05 && Z.length === 0) { spawnPack(9, true); spawnPack(6, false); }
    if (S.phaseT > 2.6) setPhase("upgrade");
  } else if (ph === "upgrade") {
    if (Z.filter(function (z) { return !z.dead; }).length < 7 && Math.random() < dt * 3) spawnPack(4, false);
    // 안 누르면 손가락이 대신 (2.6초 뒤부터 0.55초마다)
    if (S.idle > 2.6 && S.phaseT > 0.4) { doUpgrade("atk", true); S.idle = 2.05; }
    if (S.taps >= 4 && S.phaseT > 0.5) { setPhase("merge"); }
  } else if (ph === "merge") {
    if (!S.merged) MERGE.show = Math.min(1, MERGE.show + dt * 4);   // 열기 (합성 뒤엔 닫기만 — 둘이 같이 돌면 안 닫혔음)
    if (!S.merged && S.idle > 3.4 && !MERGE.drag) { MERGE.anim = 0.001; S.idle = -99; }   // 자동 끌기 시작
    if (MERGE.anim > 0) {
      MERGE.anim += dt;
      var u = Math.min(1, MERGE.anim / 0.8);
      HAND.vis = 1;
      HAND.x = MERGE.a.x + (MERGE.b.x - MERGE.a.x) * u; HAND.y = MERGE.a.y + (MERGE.b.y - MERGE.a.y) * u - Math.sin(u * Math.PI) * 40;
      MERGE.dragX = HAND.x; MERGE.dragY = HAND.y;
      if (u >= 1) { MERGE.anim = 0; doMerge(); }
    }
    if (S.merged && S.t - S.mergeT > 1.0) {   // "합성 성공" 1초 보여 준 뒤 닫음
      MERGE.show = Math.max(0, MERGE.show - dt * 3);
      if (MERGE.show <= 0) setPhase("laser");
    }
  } else if (ph === "laser") {
    if (S.phaseT > 0.8 && S.phaseT < 3.0 && Math.random() < dt * 2.5) spawnPack(7, false);
    if (S.phaseT > 4.2) {
      setPhase("boss"); SFX.boss(); S.flash = 0.35;
      BOSS = { x: 640, y: 560, tp: "z_ogre", hp: 2600000, max: 2600000, sp: 70, walk: 0, hit: 0, dead: false, deadT: 0, kb: 0, boss: true, stop: 330 };
    }
  } else if (ph === "boss") {
    if (Math.random() < dt * 1.2) spawnPack(3, false);
    if (S.phaseT > 1.6 && S.idle > 2.2) { bossTap(true); S.idle = 1.9; }   // 안 누르면 손가락이 대신 연타
    if (BOSS && BOSS.dead && BOSS.deadT > 1.5) { setPhase("clear"); SFX.win(); }
  } else if (ph === "clear") {
    if (S.phaseT > 1.6) { setPhase("end"); S.ended = true; }
  }
  if (S.t > 45 && !S.ended) { setPhase("end"); S.ended = true; }

  // 합성 창이 열린 동안은 쏘지 않음 → 창 뒤에 좀비 떼가 모였다가, 닫히면 레이저로 한 번에 (11-08)
  if (ph !== "end" && ph !== "merge") fireSquad(dt);

  // 좀비
  var all = BOSS ? Z.concat([BOSS]) : Z;
  for (var i = 0; i < all.length; i++) {
    var z = all[i];
    z.hit = Math.max(0, z.hit - dt);
    if (z.dead) { z.deadT += dt; continue; }
    if (z.kb > 0) { z.x += z.kb * dt * 10; z.kb = Math.max(0, z.kb - dt * 60); }
    if (z.x > z.stop) { z.x -= z.sp * dt * (z.hit > 0 ? 0.4 : 1); z.walk += dt * 7; }
  }
  for (var j = Z.length - 1; j >= 0; j--) if (Z[j].dead && Z[j].deadT > 1.0) Z.splice(j, 1);
  if (BOSS && !BOSS.dead && BOSS.x > BOSS.stop) BOSS.walk += 0;

  // 총알
  for (var b = B.length - 1; b >= 0; b--) {
    var o = B[b]; o.x += o.vx * dt; o.y += o.vy * dt;
    var tg = o.tg;
    if (!tg.dead && Math.abs(o.x - tg.x) < 30 && Math.abs(o.y - (tg.y - (tg.boss ? 120 : 45))) < (tg.boss ? 120 : 50)) { damage(tg, o.d, tg.x, tg.y - (tg.boss ? 200 : 60)); B.splice(b, 1); continue; }
    if (o.x > 600 || o.y < 200 || o.y > 760 || (tg.dead && o.x > tg.x + 40)) B.splice(b, 1);
  }
  for (var e = BEAMS.length - 1; e >= 0; e--) { BEAMS[e].t += dt; if (BEAMS[e].t > 0.14) BEAMS.splice(e, 1); }
  for (var f = FX.length - 1; f >= 0; f--) { FX[f].t += dt; if (FX[f].t > 0.42) FX.splice(f, 1); }
  for (var n = NUM.length - 1; n >= 0; n--) { NUM[n].t += dt; if (NUM[n].t > 0.75) NUM.splice(n, 1); }
  for (var r = RIP.length - 1; r >= 0; r--) { RIP[r].t += dt; if (RIP[r].t > 0.4) RIP.splice(r, 1); }
  for (var c = COINS.length - 1; c >= 0; c--) {
    var q = COINS[c]; q.t += dt;
    if (q.t < 0.35) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 900 * dt; }
    else { var k2 = Math.min(1, (q.t - 0.35) / 0.45); q.x += (52 - q.x) * k2; q.y += (34 - q.y) * k2; }
    if (q.t > 0.8) { S.gold += q.v; COINS.splice(c, 1); if (Math.random() < 0.4) SFX.coin(); }
  }

  // 손가락 안내 위치
  if (ph === "upgrade") { HAND.vis = 1; HAND.x = CARD.atk.x + 92; HAND.y = CARD.atk.y + 40; }
  else if (ph === "merge" && !MERGE.anim) {
    if (!S.merged && !MERGE.drag) {   // 끌기 시범 (반복)
      var u2 = (S.phaseT % 1.6) / 1.1; if (u2 > 1) u2 = 1;
      HAND.vis = 1; HAND.x = MERGE.a.x + (MERGE.b.x - MERGE.a.x) * u2; HAND.y = MERGE.a.y + (MERGE.b.y - MERGE.a.y) * u2 - Math.sin(u2 * Math.PI) * 40;
    } else HAND.vis = 0;
  } else if (ph === "boss") { HAND.vis = S.phaseT > 1.2 ? 1 : 0; HAND.x = 300 + Math.sin(S.t * 2) * 30; HAND.y = 420; }
  else HAND.vis = 0;
}

function doUpgrade(which, auto) {
  var c = CARD[which];
  c.pop = 0.15;
  if (which === "atk") { S.atkLv++; S.atk = Math.round(S.atk * 1.6); S.taps++; }
  else if (which === "spd") { S.spdLv = (S.spdLv || 60) + 1; }
  else { S.goldLv = (S.goldLv || 150) + 1; }
  S.gold = Math.max(0, S.gold - 900);
  RIP.push({ x: c.x + c.w / 2, y: c.y + c.h / 2, t: 0 });
  if (auto) HAND.press = 0.18;
  SFX.up();
}
function doMerge() {
  if (S.merged) return;
  S.merged = true; S.laser = true; S.flash = 0.25; S.shake = 0.2; S.mergeT = S.t;
  MERGE.drag = null;
  FX.push({ x: MERGE.b.x, y: MERGE.b.y + 10, t: 0, s: 1.4, ui: true });
  SFX.merge();
  // 창 뒤(안 보이는 동안)에 좀비 떼를 화면 안에 깔아 둠 → 창이 닫히면 레이저가 한 번에 쓸어버림
  for (var i = 0; i < 24; i++) spawnZombie(rnd(300, 560), 380 + 300 * (i + rnd(0.1, 0.9)) / 24);
  setTimeout(function () {}, 0);
}
function bossTap(auto) {
  if (!BOSS || BOSS.dead) return;
  S.taps++;
  for (var i = 0; i < SQUAD.length; i++) SQUAD[i].fire = Math.min(SQUAD[i].fire, 0.02);
  damage(BOSS, 95000, BOSS.x - 30 + rnd(-30, 30), BOSS.y - 180 + rnd(-40, 40));
  FX.push({ x: BOSS.x - 40 + rnd(-40, 40), y: BOSS.y - 140 + rnd(-60, 60), t: 0, s: 0.9 });
  S.shake = Math.max(S.shake, 0.12);
  RIP.push({ x: auto ? HAND.x : lastPX, y: auto ? HAND.y : lastPY, t: 0 });
  if (auto) HAND.press = 0.15;
  SFX.boom();
}

// ---------------------------------------------------------------- 입력
var lastPX = 0, lastPY = 0;
function toLogic(e) {
  var p = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0]) || e;
  return { x: (p.clientX - offX) / scale, y: (p.clientY - offY) / scale };
}
function inRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function near(p, q, d) { return Math.abs(p.x - q.x) < d && Math.abs(p.y - q.y) < d; }
function down(e) {
  e.preventDefault(); audioOn();
  var p = toLogic(e); lastPX = p.x; lastPY = p.y; S.idle = 0;
  if (S.phase === "end") { ctaDone = true; cta(); return; }
  if (inRect(p, INSTALL)) { cta(); return; }
  if (S.phase === "intro") {   // 시작 장면에서 바로 카드를 눌러도 강화로 (11-08 — 전엔 2.6초 동안 무시됨)
    for (var k0 in CARD) if (inRect(p, CARD[k0])) { setPhase("upgrade"); doUpgrade(k0, false); return; }
  }
  if (S.phase === "upgrade") {
    for (var k in CARD) if (inRect(p, CARD[k])) { doUpgrade(k, false); return; }
  } else if (S.phase === "merge" && !S.merged) {
