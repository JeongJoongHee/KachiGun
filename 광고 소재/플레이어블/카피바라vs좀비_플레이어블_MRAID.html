var AC = null, muted = false;
function audioOn() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol) {
  if (!AC || muted) return;
  var len = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  var s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 900; s.buffer = b; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
var lastShot = 0;
var SFX = {
  shot: function () { var n = performance.now(); if (n - lastShot < 45) return; lastShot = n; tone(900, 260, 0.05, "square", 0.025); },
  laser: function () { var n = performance.now(); if (n - lastShot < 60) return; lastShot = n; tone(1500, 500, 0.09, "sawtooth", 0.025); },
  coin: function () { tone(1320, 1320, 0.05, "sine", 0.05); tone(1760, 1760, 0.07, "sine", 0.05, 0.05); },
  up: function () { tone(520, 1040, 0.12, "triangle", 0.12); },
  merge: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, f, 0.12, "square", 0.06, i * 0.07); }); },
  boom: function () { noise(0.3, 0.35); tone(140, 40, 0.3, "sine", 0.3); },
  boss: function () { tone(110, 70, 0.6, "sawtooth", 0.12); tone(82, 55, 0.6, "square", 0.08, 0.15); },
  win: function () { [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, f, 0.18, "triangle", 0.12, i * 0.09); }); }
};

function fmt(v) {
  if (v < 1000) return Math.floor(v) + "";
  var u = ["", "k", "m", "b", "t"], k = Math.floor(Math.log10(v) / 3); k = Math.min(k, 4);
  var m = v / Math.pow(10, k * 3);
  var s = m < 10 ? (Math.floor(m * 100) / 100).toFixed(2) : m < 100 ? (Math.floor(m * 10) / 10).toFixed(1) : Math.floor(m) + "";
  if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
  return s + u[k];
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function setPhase(p) { S.phase = p; S.phaseT = 0; S.idle = 0; }

function spawnZombie(x, y, type, hp) {
  var tp = type || ZTYPES[Math.floor(Math.random() * ZTYPES.length)];
  var hpv = hp || (tp === "z_fat" ? 9000 : tp === "z_bucket" ? 6000 : 4000);
  Z.push({ x: x, y: y, tp: tp, hp: hpv, max: hpv, sp: rnd(38, 58) * (tp === "z_fat" ? 0.7 : 1), walk: Math.random() * 4, hit: 0, dead: false, deadT: 0, kb: 0, stop: rnd(175, 215) });
}
function spawnPack(n, near) {
  for (var i = 0; i < n; i++) {
    var y = 380 + (300 * (i + rnd(0.1, 0.9))) / n;
    spawnZombie((near ? rnd(330, 520) : rnd(570, 650)) + i * 4, y);   // near = 이미 화면 안 (시작 장면)
  }
}
// 총구 = 칸(360) 안 총 회전 중심 (171,253) + 총구 (137.6,-17.6) → (308.6, 235.4) · 그림 왼쪽 위 = 발 (160, 352) 기준
function muzzle(c) { return { x: c.x + (308.6 - 160) * c.s, y: c.y - (352 - 235.4) * c.s }; }

function nearest(c) {
  var best = null, bd = 1e9;
  for (var i = 0; i < Z.length; i++) {
    var z = Z[i]; if (z.dead || z.x > 560) continue;
    var d = Math.abs(z.y - c.y) * 1.4 + (z.x - c.x);
    if (d < bd) { bd = d; best = z; }
  }
  if (BOSS && !BOSS.dead && BOSS.x < 540) { var db = Math.abs(BOSS.y - c.y) * 1.4 + (BOSS.x - c.x) - 120; if (db < bd) best = BOSS; }
  return best;
}

function damage(z, d, x, y) {
  if (z.dead) return;
  z.hp -= d; z.hit = 0.12; if (!z.boss) z.kb = 10;
  NUM.push({ x: x + rnd(-12, 12), y: y - 30 + rnd(-10, 10), v: d, t: 0, big: d >= 20000 || z.boss });
  if (z.hp <= 0) {
    z.dead = true; z.deadT = 0; S.kills++;
    FX.push({ x: z.x, y: z.y - 50 * (z.boss ? 2.4 : 1), t: 0, s: z.boss ? 2.6 : 0.8 });
    var nc = z.boss ? 14 : 2;
    for (var k = 0; k < nc; k++) COINS.push({ x: z.x + rnd(-20, 20), y: z.y - 60, vx: rnd(-90, 90), vy: rnd(-260, -120), t: 0, v: z.boss ? 250000 : 900 });
    if (z.boss) { SFX.boom(); S.shake = 0.6; S.flash = 0.5; } else if (Math.random() < 0.5) SFX.boom();
  }
}

function fireSquad(dt) {
  for (var i = 0; i < SQUAD.length; i++) {
    var c = SQUAD[i];
    c.shoot = Math.max(0, c.shoot - dt);
    c.fire -= dt;
    if (c.fire > 0) continue;
    var tg = nearest(c);
    if (!tg) { c.fire = 0.1; continue; }
    var m = muzzle(c);
    c.shoot = 0.12;
    if (S.laser) {
      c.fire = 0.26;
      var tx = Math.max(m.x + 60, tg.x), ty = tg.boss ? tg.y - 110 : tg.y - 40;
      var slope = (ty - m.y) / (tx - m.x);
      BEAMS.push({ x: m.x, y: m.y, ex: 580, ey: m.y + slope * (580 - m.x), t: 0 });
      SFX.laser();
      // 레이저 = 그 줄 위 좀비 전부
      for (var k = 0; k < Z.length; k++) {
        var z = Z[k]; if (z.dead || z.x < m.x) continue;
        var ly = m.y + slope * (z.x - m.x);

  roundRect(W / 2 - bw / 2, 742 + 6, bw, bh, bh / 2, "#3c6e28");

  txt("지금 무료 플레이", W / 2, 742 + bh / 2 - 2, 40 * p, "#fff", "#1C110A", 6);
  txt("Google Play 에서 다운로드", W / 2, 862, 22, "#1C110A", "#FFF4D6", 3);
  cx.globalAlpha = 1;
}

function render() {
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#2b1d12"; cx.fillRect(0, 0, cv.width, cv.height);
  var sh = S.shake > 0 ? (Math.random() - 0.5) * 14 * S.shake / 0.6 : 0;
  cx.setTransform(scale * dpr, 0, 0, scale * dpr, (offX + sh) * dpr, (offY + sh * 0.5) * dpr);
  cx.save(); cx.beginPath(); cx.rect(0, 0, W, H); cx.clip();

  // 배경 (숲 · 흙길 · 덤불)
  img("map", -69, 0, 678, 960);

  // 위: 진행 막대 · 스테이지 · 금화
  roundRect(14, 12, W - 160, 28, 12, "#5a3d24", "#1C110A", 4);
  var prog = Math.min(1, S.kills / 60);
  roundRect(18, 16, (W - 168) * Math.max(0.04, prog), 20, 9, BOSS && !BOSS.dead ? "#E5533D" : "#6EBE46");
  txt(BOSS && !BOSS.dead ? "보스!" : Math.floor(prog * 100) + "%", (W - 160) / 2 + 14, 27, 18, "#fff", "#1C110A", 3);
  roundRect(14, 50, 150, 42, 18, "rgba(255,244,214,0.92)", "#1C110A", 4);
  img("coin", 18, 51, 40, 40);
  txt(fmt(S.gold), 152, 72, 24, "#3a2a1c", "#FFF4D6", 3, "right");
  txt("Stage 11-2", W / 2, 72, 32, "#fff", "#1C110A", 6);
  // 설치 버튼 (언제나)
  roundRect(INSTALL.x, INSTALL.y + 3, INSTALL.w, INSTALL.h, 22, "#3c6e28");
  roundRect(INSTALL.x, INSTALL.y, INSTALL.w, INSTALL.h, 22, "#6EBE46", "#1C110A", 4);
  txt("설치", INSTALL.x + INSTALL.w / 2, INSTALL.y + INSTALL.h / 2, 24, "#fff", "#1C110A", 4);

  // 좀비 · 보스 · 분대 (아래에 있을수록 앞)
  var list = Z.slice(); if (BOSS) list.push(BOSS);
  list.sort(function (p, q) { return p.y - q.y; });
  var drawn = false;
  for (var i = 0; i < list.length; i++) drawZombie(list[i]);
  for (var j = 0; j < SQUAD.length; j++) drawCapy(SQUAD[j]);

  // 총알 · 레이저
  for (var b = 0; b < B.length; b++) { var o = B[b]; cx.save(); cx.translate(o.x, o.y); cx.rotate(Math.atan2(o.vy, o.vx)); img("bullet", -20, -11, 40, 22); cx.restore(); }
  for (var e = 0; e < BEAMS.length; e++) {
    var bm = BEAMS[e], a = 1 - bm.t / 0.14;
    cx.globalCompositeOperation = "lighter";
    cx.strokeStyle = "rgba(120,240,255," + (0.85 * a) + ")"; cx.lineWidth = 22 * a + 4; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(bm.x, bm.y); cx.lineTo(bm.ex, bm.ey); cx.stroke();
    cx.strokeStyle = "rgba(255,255,255," + a + ")"; cx.lineWidth = 7 * a + 1;
    cx.beginPath(); cx.moveTo(bm.x, bm.y); cx.lineTo(bm.ex, bm.ey); cx.stroke();
    cx.globalCompositeOperation = "source-over";
  }
  // 폭발
  for (var f = 0; f < FX.length; f++) {
    var fx = FX[f], fi = Math.min(2, Math.floor(fx.t / 0.14)), s = 110 * fx.s * (0.8 + fx.t);
    img("boom" + fi, fx.x - s / 2, fx.y - s / 2, s, s, 1 - fx.t / 0.42 * 0.5);
  }
  // 데미지 숫자
  for (var n = 0; n < NUM.length; n++) {
    var nm = NUM[n], al = 1 - Math.max(0, nm.t - 0.45) / 0.3;
    cx.globalAlpha = Math.max(0, al);
    txt(fmt(nm.v), nm.x, nm.y - nm.t * 50, nm.big ? 34 : 24, nm.big ? "#FFCD50" : "#fff", "#1C110A", nm.big ? 6 : 4);
    cx.globalAlpha = 1;
  }
  // 금화
  for (var c = 0; c < COINS.length; c++) img("coin", COINS[c].x - 14, COINS[c].y - 14, 28, 28);

  // 아래 UI: 총알 칸 · 강화 카드 3장
  roundRect(4, 718, W - 8, 236, 20, "rgba(120,78,44,0.95)", "#1C110A", 5);
  drawSlotRow();
  drawCard("atk", "공격력", S.atkLv, 100 * Math.pow(1.6, S.atkLv - 40) * 2.79, 12100 * Math.pow(1.3, S.atkLv - 40));
  drawCard("spd", "공격속도", S.spdLv || 60, 467, 188000);
  drawCard("gold", "금전 획득량", S.goldLv || 150, 2030, 642000000);

  // 장면 문구
  var ph = S.phase;
  if (ph === "intro") banner("좀비 떼가 몰려온다!", "카피바라 분대, 발사!", S.phaseT);
  else if (ph === "upgrade") banner("공격력 카드를 탭!", "누를수록 세지는 분대 (" + Math.min(S.taps, 4) + "/4)", S.phaseT);
  else if (ph === "laser") banner("레이저로 쓸어버려!", "D부터 SSU까지 13등급 합성", S.phaseT);
  else if (ph === "boss") {
    if (S.phaseT < 1.2) { cx.globalAlpha = 0.25 + 0.2 * Math.sin(S.t * 18); cx.fillStyle = "#E5533D"; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; txt("보스 등장!", W / 2, 360, 72, "#FFCD50", "#7a1b10", 10); }
    else banner("화면을 연타!", "보스를 쓰러뜨려라", S.phaseT - 1.2);
  } else if (ph === "clear") { txt("STAGE CLEAR!", W / 2, 360, 64, "#FFCD50", "#1C110A", 10); }

  drawMergePanel();

  // 탭 물결 · 손가락
  for (var r = 0; r < RIP.length; r++) {
    var rp = RIP[r], ra = 1 - rp.t / 0.4;
    cx.strokeStyle = "rgba(255,255,255," + ra + ")"; cx.lineWidth = 6; cx.beginPath(); cx.arc(rp.x, rp.y, 14 + 50 * rp.t / 0.4, 0, Math.PI * 2); cx.stroke();
  }
  if (HAND.vis && ph !== "end") {
    var bob = (ph === "upgrade" || ph === "boss") ? Math.abs(Math.sin(S.t * 6)) * 16 : 0, pr = HAND.press > 0 ? 10 : 0;
    img("arrow", HAND.x - 34, HAND.y - 96 - bob + pr, 68, 68);
  }
  if (S.flash > 0) { cx.globalAlpha = S.flash * 1.2; cx.fillStyle = "#fff"; cx.fillRect(0, 0, W, H); cx.globalAlpha = 1; }
  if (ph === "end") drawEnd();
  probBadge(ph === "end");
  cx.restore();
}

// ---------------------------------------------------------------- 시작
var last = 0;
function loop(ts) {
  var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
  update(dt); render();
  requestAnimationFrame(loop);
}
function start() {
  resize();
  // 시험용: ?jump=초 → 그만큼 미리 진행(손가락 자동)한 화면부터
  var m = /[?&]jump=([\d.]+)/.exec(location.search);
  if (m) { var n = Math.round(parseFloat(m[1]) * 60); for (var i = 0; i < n; i++) update(1 / 60); }
  requestAnimationFrame(loop);
}
function boot() {
  var go = function () { loadImages(start); };
  if (FONT && FONT.length > 20 && window.FontFace) {
    try {
      var ff = new FontFace("Jua", "url(data:font/woff2;base64," + FONT + ")");
      ff.load().then(function (f) { document.fonts.add(f); go(); }, go);
      return;
    } catch (e) {}
  }
  go();
}
if (window.mraid && mraid.getState && mraid.getState() === "loading") mraid.addEventListener("ready", boot);
else if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
